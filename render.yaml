services:
  # 1. PulseChain Backend (Node.js REST API Web Service)
  - type: web
    name: pulsechain-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # 2. PulseChain Frontend (Vite React SPA Static Site)
  - type: web
    name: pulsechain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: header
        source: /*
        headers:
          - name: Access-Control-Allow-Origin
            value: "*"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pulsechain-backend.onrender.com
